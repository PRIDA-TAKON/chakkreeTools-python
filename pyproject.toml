[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chakkree-tools-python"
version = "0.1.0"
description = "Python port & reverse-engineering of Chakkree Tools for IngeTrazo and .debim OpenBIM ecosystem"
readme = "README.md"
authors = [
    { name = "Chakkree Tiyawongsuwan", email = "author@original.sketchup.plugin" },
    { name = "PRIDA-TAKON", email = "contributor@chakkreeTools-python" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
gui = [
    "PySide6>=6.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
