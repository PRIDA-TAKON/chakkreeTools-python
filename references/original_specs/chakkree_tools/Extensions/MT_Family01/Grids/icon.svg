      <line x1='20' x2='20'  y1='-2' y2='25' stroke='gray' stroke-width='2' stroke-dasharray='5 2'/>
	  <circle cx='20' cy='-11' r='5' fill='white' stroke='green' stroke-width='1'/>
	  <text x='20' y='-11' text-anchor='middle' alignment-baseline="middle" fill='black' stroke='none' font-size='7' font-family='arial'>2</text>
	  
